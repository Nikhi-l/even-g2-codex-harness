<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="t d"><title id="t">Even G2 artifact harness architecture</title><desc id="d">Codex uses MCP to update a private relay. The phone polls validated artifact state, renders two image tiles plus native answer text, and sends input and receipts. Even Hub owns Bluetooth to G2.</desc><rect width="1280" height="540" rx="20" fill="#f4f6f3"/><text x="52" y="61" font-family="sans-serif" font-size="26" font-weight="600" fill="#193d28">One artifact. Three clear boundaries.</text><g font-family="sans-serif"><g fill="#fff" stroke="#cbd8cb" stroke-width="2"><rect x="52" y="132" width="226" height="210" rx="14"/><rect x="344" y="132" width="254" height="210" rx="14"/><rect x="665" y="132" width="282" height="210" rx="14"/><rect x="1014" y="132" width="214" height="210" rx="14"/></g><g fill="#245b3a" font-size="21" font-weight="600"><text x="76" y="174">Codex / MCP client</text><text x="368" y="174">Private relay</text><text x="689" y="174">Phone / Even Hub</text><text x="1038" y="174">Even G2</text></g><g fill="#586d5e" font-size="16"><text x="76" y="213">show_artifact</text><text x="76" y="242">display_status</text><text x="76" y="271">display_events</text><text x="76" y="310">stdio or HTTPS MCP</text><text x="368" y="213">Validated templates</text><text x="368" y="242">Revision + TTL + events</text><text x="368" y="271">One isolated wearer</text><text x="368" y="310">No model or shell runtime</text><text x="689" y="213">Canvas artifact renderer</text><text x="689" y="242">2 image tiles + answer text</text><text x="689" y="271">Serialized SDK adapter</text><text x="689" y="310">Preview and delivery state</text><text x="1038" y="213">576 × 288</text><text x="1038" y="242">Green display</text><text x="1038" y="271">Tap / scroll input</text><text x="1038" y="310">No browser DOM</text></g><g stroke="#477856" stroke-width="2.5" fill="none"><path d="M279 232h60m-9-7 9 7-9 7M599 232h61m-9-7 9 7-9 7M948 232h61m-9-7 9 7-9 7"/><path d="M805 347v54H167v-54" stroke-dasharray="6 6"/></g><g fill="#4b6554" font-size="13"><text x="286" y="209">MCP</text><text x="605" y="209">HTTPS</text><text x="955" y="209">BLE</text><text x="292" y="430">Input events and delivery receipts return through the relay. Codex polls; events do not start turns.</text><text x="52" y="495">Browser rendered ≠ bridge accepted ≠ visually verified on hardware. This repository records the first two.</text></g></g></svg>
